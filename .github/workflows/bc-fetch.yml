name: bc-fetch
# BET CHANNELの配信を定時更新の15分前に取得して data/bc/feed/ に保存（PCオフでも定時更新が実オッズを使えるように）
# 2026-09-28 00:34 の試験で GitHub（米国）の実行環境からは HTTP 503 で拒否された。定時実行は止め、手動実行だけ残す。
# 実運用は日本のVPSで scripts/bc_fetch.py を cron 実行する（RUNBOOK参照）。
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: bc-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/bc_fetch.py || true
      - name: commit
        run: |
          git config user.name "rmc-bc-fetch"; git config user.email "actions@users.noreply.github.com"
          git add data/bc/feed
          git diff --cached --quiet && exit 0
          git commit -m "BET CHANNEL配信を取得（GitHub Actions）"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
