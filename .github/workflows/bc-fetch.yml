name: bc-fetch
# BET CHANNELの配信を定時更新の15分前に取得して data/bc/feed/ に保存（PCオフでも定時更新が実オッズを使えるように）
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20,2,8,13 * * *"   # JST 05:40 / 11:40 / 17:40 / 22:40
  push:
    branches: [main]
    paths: [".github/workflows/bc-fetch.yml", "scripts/bc_fetch.py"]
permissions:
  contents: write
concurrency: { group: bc-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/bc_fetch.py || true
      - name: commit
        run: |
          git config user.name "rmc-bc-fetch"; git config user.email "actions@users.noreply.github.com"
          git add data/bc/feed
          git diff --cached --quiet && exit 0
          git commit -m "BET CHANNEL配信を取得（GitHub Actions）"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
