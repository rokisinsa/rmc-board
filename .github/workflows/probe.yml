name: probe-sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml", "scripts/probe_sources.py", "scripts/probe_livescore.py", "scripts/probe_raw.py", "scripts/probe_fixtures.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/probe_fixtures.py
      - run: |
          git config user.name "rmc-probe"; git config user.email "actions@users.noreply.github.com"
          git add data/probe; git diff --cached --quiet && exit 0
          git commit -m "⑤用ソースの疎通確認（GitHub Actions）"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
