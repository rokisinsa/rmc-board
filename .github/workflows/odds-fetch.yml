name: odds-fetch
# 公開オッズ配信を定時更新の15分前に取得して data/odds_feed/ に保存（PCオフでも定時更新が実オッズを使える）
on:
  workflow_dispatch:
  schedule:
    - cron: "40 * * * *"   # 毎時40分（定時更新の15分前を含む）。締切前オッズ（CLV用）も毎時記録
  push:
    branches: [main]
    paths: [".github/workflows/odds-fetch.yml", "scripts/odds_fetch.py", "scripts/tennis_fetch.py"]
permissions:
  contents: write
concurrency: { group: odds-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/odds_fetch.py
      - run: python scripts/tennis_fetch.py || true
      - run: python scripts/closing_capture.py || true
      - name: commit
        run: |
          git config user.name "rmc-odds-fetch"; git config user.email "actions@users.noreply.github.com"
          git add data/odds_feed data/odds_closing.json data/basic
          git diff --cached --quiet && exit 0
          git commit -m "公開オッズ配信を取得・締切前オッズを記録（GitHub Actions）"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
