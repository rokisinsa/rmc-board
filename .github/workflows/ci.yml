name: test-validate-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Data validation (locked check against previous commit)
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            python -m rmc.validate --base HEAD~1
          else
            python -m rmc.validate
          fi
      - name: Profit audit (summary.json must equal recomputation)
        run: |
          cp data/summary.json /tmp/summary.before.json
          python -m rmc.build
          python - <<'EOF'
          import json
          a=json.load(open('/tmp/summary.before.json'))['logics']; b=json.load(open('data/summary.json'))['logics']
          assert a==b, 'summary.json mismatch'
          print('profit audit ok')
          EOF

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp deployed commit
        run: |
          mkdir -p data/deploys
          echo "{\"sha\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\"}" > data/deploy.json
          cp data/deploy.json "data/deploys/${GITHUB_SHA}.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
