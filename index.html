<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RMC 分析ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#F3F5F1;--surface:#FFFFFF;--sunk:#E9EDE7;--ink:#15201B;--muted:#5C6A62;--line:#D6DDD5;
  --accent:#0E7A5C;--pos:#1B7A44;--neg:#B23A2E;
  --ok:#1B7A44;--ok-bg:#E1F2E7;--warn:#9A6412;--warn-bg:#FBEFD8;--ex:#6E7872;--ex-bg:#ECEFEC;--nd:#565C86;--nd-bg:#E7E8F3;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;--bg:#0E1412;--surface:#161F1B;--sunk:#1D2823;--ink:#E4ECE7;--muted:#98A79F;--line:#2B3832;
  --accent:#3DBE95;--pos:#5FD18E;--neg:#F07A6B;
  --ok:#5FD18E;--ok-bg:#15301F;--warn:#E7B45A;--warn-bg:#33270F;--ex:#8F9A94;--ex-bg:#222B27;--nd:#A4A9DC;--nd-bg:#23253A;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0}
h1 small{display:block;font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.14em;font-weight:600}
h2{font-family:var(--display);font-size:18px;margin:0 0 10px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.runinfo{font-size:12px;color:var(--muted);text-align:right;display:flex;flex-direction:column;gap:2px}
.runinfo b{font-family:var(--mono);color:var(--ink);font-weight:600}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner ul{margin:4px 0 0;padding-left:18px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .t{font-family:var(--display);font-weight:700}
.card .big{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.mono{font-family:var(--mono)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px}
input[type=search]{flex:1 1 200px;min-width:0}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
details.sport{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sport>summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;list-style:none}
details.sport>summary::-webkit-details-marker{display:none}
details.sport>summary .name{font-family:var(--display);font-weight:700;font-size:15px}
details.sport>summary .stat{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:4px 12px;padding:8px 14px;border-top:1px solid var(--line);align-items:center}
.mrow.past{opacity:.55}
.mt .c{font-size:11px;color:var(--muted)}.mt .n{font-weight:700}
.mt .o{font-family:var(--mono);font-size:12px;color:var(--accent)}
.time{font-family:var(--mono);font-size:12px}.time .d{display:block;font-size:11px;color:var(--muted)}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.b{appearance:none;border:0;border-radius:6px;padding:3px 7px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--mono)}
.b:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.s-formal{background:var(--ok);color:var(--surface)}
.s-watch{background:var(--warn-bg);color:var(--warn)}
.s-rej{background:var(--ex-bg);color:var(--ex)}
.s-nodata{background:var(--nd-bg);color:var(--nd)}
.detail{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.detail .kv{grid-template-columns:auto 1fr;max-width:520px}
.detail .kv dd{text-align:left}
.flag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-right:4px}
.ledger-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ledger-tabs button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.ledger-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.err{padding:18px;color:var(--neg)}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mrow{grid-template-columns:62px minmax(0,1fr)}.badges{grid-column:1/-1;justify-content:flex-start}.runinfo{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>RESULT MANAGEMENT CENTER</small>RMC 分析ボード</h1>
    <div class="runinfo" id="runinfo">読み込み中…</div>
  </header>
  <div id="banner"></div>

  <section>
    <h2>収支（正式採用のみ・$100固定）</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>競技別カバレッジ</h2>
    <div class="tbl"><table id="cov"></table></div>
  </section>

  <section>
    <h2>試合一覧と①〜④の判定</h2>
    <div class="controls">
      <label class="tog"><input type="checkbox" id="up" checked> これから始まる試合だけ</label>
      <label class="tog"><input type="checkbox" id="hasPick"> どれかで採用・watchのある試合だけ</label>
      <input type="search" id="q" placeholder="チーム・選手・大会で絞り込み" aria-label="検索">
    </div>
    <p style="font-size:12px;color:var(--muted);margin:6px 0 10px">各試合の ①②③④ を押すと、そのロジック専用の分析を開きます。濃い緑＝正式採用、黄＝watch、灰＝除外、紫＝データ不足。</p>
    <div id="sports" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <section>
    <h2>正式採用の台帳</h2>
    <div class="ledger-tabs" id="ltabs"></div>
    <div class="tbl"><table id="ledger"></table></div>
  </section>
</div>
<script>
(async function(){
const LG=['r1','r2','r3','r4'], T={r1:'① 推奨取引',r2:'② VALUE①',r3:'③ VALUE②',r4:'④ PRO EDGE',experience:'経験値取引'};
const FORMAL={r1:'accepted',r2:'formal',r3:'adopted',r4:'accepted'};
const JA={accepted:'正式',formal:'正式',adopted:'正式',conditional:'条件付',watch:'watch',rejected:'除外',excluded:'除外',nodata:'データ不足'};
const cls=(lg,s)=>s===FORMAL[lg]?'s-formal':(s==='watch'||s==='conditional')?'s-watch':s==='nodata'?'s-nodata':'s-rej';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>v==null?'—':(v>0?'+':'')+'$'+v.toFixed(2);
const bust='?v='+Date.now();
const get=f=>fetch('data/'+f+bust,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.json();});
let D;
try{
  const [matches,odds,runs,summary,...rest]=await Promise.all([get('matches.json'),get('odds_snapshots.json'),get('automation-runs.json'),get('summary.json'),
    ...LG.map(l=>get('analysis/'+l+'.json')),...LG.concat('experience').map(l=>get('ledger/'+l+'.json'))]);
  const ana={},led={};LG.forEach((l,i)=>ana[l]=rest[i]);LG.concat('experience').forEach((l,i)=>led[l]=rest[4+i]);
  const oi={};odds.forEach(o=>{if(!oi[o.match_id]||o.taken_at>oi[o.match_id].taken_at)oi[o.match_id]=o;});
  const ai={};LG.forEach(l=>{ai[l]={};ana[l].rows.forEach(r=>ai[l][r.match_id]=r);});
  D={matches,odds:oi,runs,summary,ana:ai,led};
}catch(e){document.querySelector('.wrap').insertAdjacentHTML('beforeend',`<div class="err">データを読み込めませんでした（${esc(e.message)}）。</div>`);return;}

const run=D.runs[D.runs.length-1];
const jst=iso=>{const d=new Date(iso),j=new Date(d.getTime()+9*3600e3),p=n=>String(n).padStart(2,'0');return{d:`${j.getUTCMonth()+1}/${j.getUTCDate()}`,t:`${p(j.getUTCHours())}:${p(j.getUTCMinutes())}`};};
document.getElementById('runinfo').innerHTML=`<span>最新更新 <b>${esc(run.run_id)}</b></span><span>完了 <b>${esc((run.finished_at||'').replace('T',' ').slice(0,16))} JST</b></span><span>集計 run <b>${esc(D.summary.run_id)}</b>／状態 <b>${esc(run.status)}</b></span>`;
document.getElementById('banner').innerHTML = run.status==='complete'
  ? `<div class="banner ok">定時更新完了：チェックリスト41項目すべて完了</div>`
  : `<div class="banner"><b>この回は完全更新ではありません（${esc(run.status)}）。</b>未完了の項目：<ul>${(run.blockers||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`;

// 収支カード
document.getElementById('cards').innerHTML=LG.concat('experience').map(l=>{const s=D.summary.logics[l];
  return `<div class="card"><span class="t">${T[l]}</span><span class="big ${s.net>0?'pos':s.net<0?'neg':''}">${money(s.net)}</span>
  <dl class="kv"><dt>戦績</dt><dd>${s.settled}戦 ${s.win}勝 ${s.loss}敗${s.void?' / 無効'+s.void:''}</dd><dt>勝率</dt><dd>${s.hit_rate??'—'}${s.hit_rate!=null?'%':''}</dd>
  <dt>ROI</dt><dd>${s.roi??'—'}${s.roi!=null?'%':''}</dd><dt>確定投入</dt><dd>$${s.staked.toFixed(2)}</dd><dt>正式件数</dt><dd>${s.formal}</dd><dt>未確定</dt><dd>${s.pending}</dd>
  <dt>金額未計算</dt><dd>${s.amount_missing}</dd><dt>複利（参考）</dt><dd>$${s.compound_ref.toFixed(2)}</dd><dt>1/4ケリー</dt><dd>${money(s.kelly_quarter.profit)}（${s.kelly_quarter.bets}件）</dd></dl></div>`;}).join('');

// カバレッジ
const cov=run.coverage||{};
const lgCell=(c,l)=>{const x=c[l]||{};return `${x.screened||0}→${x.deep_dive||0}→${x.formal||0}/${x.watch||0}/${x.rejected||0}`;};
document.getElementById('cov').innerHTML=`<thead><tr><th>競技</th><th>走査</th><th>価格あり・未開始</th>${LG.map(l=>`<th>${T[l]}<br><span style="font-size:10.5px">走査→深掘り→正式/watch/除外</span></th>`).join('')}</tr></thead><tbody>`+
  Object.entries(cov).sort((a,b)=>b[1].event_count-a[1].event_count).map(([sp,c])=>`<tr><td>${esc(sp)}</td><td class="mono">${c.event_count}</td><td class="mono">${c.priced_upcoming_count}</td>${LG.map(l=>`<td class="mono">${lgCell(c,l)}</td>`).join('')}</tr>`).join('')+'</tbody>';

// 試合一覧（競技別）
const st={up:true,pick:false,q:'',open:null};
function metrics(l,r){const f=(k,v)=>v==null||v===''?'':`<dt>${k}</dt><dd>${esc(v)}</dd>`;
  let h=f('選択',r.pick)+f('オッズ',r.odds);
  if(l==='r1')h+=f('適正勝率',r.nv!=null?r.nv+'%':'')+f('格差',r.gap)+f('信頼度',r.conf)+f('控除率',r.overround!=null?r.overround+'%':'');
  if(l==='r2')h+=f('必要勝率',r.need!=null?r.need+'%':'')+f('推定勝率',r.est)+f('推定EV',r.ev_range);
  if(l==='r3')h+=f('必要勝率',r.need!=null?r.need+'%':'')+f('推定勝率',r.est)+f('市場差',r.diff)+f('Upset Risk',r.upset);
  if(l==='r4')h+=f('市場適正',r.fair!=null?r.fair+'%':'')+f('RMC最終',r.final!=null?r.final+'%':'')+f('EDGE',r.edge)+f('EV',r.ev)+f('最低購入',r.min_odds)+f('信頼度',r.reliability);
  h+=f('深掘り',r.deep_dive?'実施':'未実施')+f('補正根拠',r.adj_reason);
  if(r.deep_dive_detail)for(const[k,v]of Object.entries(r.deep_dive_detail))h+=f(k,typeof v==='object'?JSON.stringify(v):v);
  return h;}
function renderSports(){
  const now=Date.now();const by={};
  for(const[mid,m]of Object.entries(D.matches)){
    if(st.up&&new Date(m.start_jst).getTime()<=now)continue;
    if(st.q&&!(m.left+m.right+m.competition).toLowerCase().includes(st.q))continue;
    if(st.pick&&!LG.some(l=>{const s=D.ana[l][mid]?.status;return s===FORMAL[l]||s==='watch'||s==='conditional';}))continue;
    (by[m.sport]=by[m.sport]||[]).push([mid,m]);}
  const el=document.getElementById('sports');
  const keys=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
  if(!keys.length){el.innerHTML='<div class="empty">条件に当てはまる試合はありません。</div>';return;}
  el.innerHTML=keys.map(sp=>{const list=by[sp].sort((a,b)=>a[1].start_jst.localeCompare(b[1].start_jst));
    const cnt=l=>list.filter(([mid])=>D.ana[l][mid]?.status===FORMAL[l]).length;
    const w=list.filter(([mid])=>LG.some(l=>D.ana[l][mid]?.status==='watch')).length;
    return `<details class="sport" ${keys.length<=3?'open':''}><summary><span class="name">${esc(sp)}</span><span class="stat">${list.length}試合｜正式 ①${cnt('r1')} ②${cnt('r2')} ③${cnt('r3')} ④${cnt('r4')}｜watchあり ${w}</span></summary>`+
    list.map(([mid,m])=>{const t=jst(m.start_jst),o=D.odds[mid];const past=new Date(m.start_jst).getTime()<=now;
      const os=o?Object.entries(o.prices).map(([k,v])=>`${k==='L'?m.left.slice(0,10):k==='R'?m.right.slice(0,10):'分'} ${v}`).join(' / '):'オッズなし';
      const open=st.open&&st.open[0]===mid?st.open[1]:null;
      const r=open?D.ana[open][mid]:null;
      return `<div class="mrow ${past?'past':''}"><div class="time"><span class="d">${t.d}</span>${t.t}</div>
      <div class="mt"><div class="c">${esc(m.competition)}${m.status!=='scheduled'?'｜'+esc(m.status):''}</div><div class="n">${esc(m.left)} vs ${esc(m.right)}</div><div class="o">${esc(os)}</div></div>
      <div class="badges">${LG.map(l=>{const s=D.ana[l][mid]?.status||'nodata';return `<button class="b ${cls(l,s)}" data-m="${mid}" data-l="${l}" aria-expanded="${open===l}" title="${T[l]}：${s}">${T[l].slice(0,1)} ${JA[s]||s}</button>`;}).join('')}</div>
      ${r?`<div class="detail"><b>${T[open]}｜${esc(JA[r.status]||r.status)}</b><div>${esc(r.reason)}</div><dl class="kv">${metrics(open,r)}</dl>
        ${(m.flags||[]).length?`<div>${m.flags.map(f=>`<span class="flag">${esc(f)}</span>`).join('')}</div>`:''}
        ${o?`<div style="color:var(--muted)">オッズ出典：${esc(o.source)}（${esc(o.taken_at.replace('T',' ').slice(0,16))}取得${o.exact?'':'・集計値'}）</div>`:''}</div>`:''}</div>`;}).join('')+'</details>';}).join('');
  el.querySelectorAll('.b').forEach(b=>b.onclick=()=>{const k=[b.dataset.m,b.dataset.l];st.open=(st.open&&st.open[0]===k[0]&&st.open[1]===k[1])?null:k;
    const openSet=[...el.querySelectorAll('details[open]')].map(d=>d.querySelector('.name').textContent);renderSports();
    el.querySelectorAll('details').forEach(d=>{if(openSet.includes(d.querySelector('.name').textContent))d.open=true;});});
}
document.getElementById('up').onchange=e=>{st.up=e.target.checked;renderSports();};
document.getElementById('hasPick').onchange=e=>{st.pick=e.target.checked;renderSports();};
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();renderSports();};
renderSports();

// 台帳
let lt='r1';
function renderLedger(){
  document.getElementById('ltabs').innerHTML=LG.concat('experience').map(l=>`<button aria-pressed="${l===lt}" data-l="${l}">${T[l]}（${D.led[l].length}）</button>`).join('');
  document.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>{lt=b.dataset.l;renderLedger();});
  const rows=D.led[lt];const tb=document.getElementById('ledger');
  if(!rows.length){tb.innerHTML=`<tbody><tr><td class="empty" style="text-align:center">${T[lt]}の正式採用はまだありません。</td></tr></tbody>`;return;}
  tb.innerHTML=`<thead><tr><th>結果</th><th>開始</th><th>試合</th><th>選択</th><th>オッズ</th><th>投入</th><th>払戻</th><th>損益</th><th>ロック</th></tr></thead><tbody>`+
   rows.slice().sort((a,b)=>(D.matches[b.match_id]?.start_jst||'').localeCompare(D.matches[a.match_id]?.start_jst||'')).map(e=>{const m=D.matches[e.match_id]||{};const r=e.result;const t=jst(m.start_jst||e.locked_at);
    const mark=!r?'△':r.outcome==='win'?'○':r.outcome==='loss'?'×':'無';
    return `<tr><td>${mark}</td><td class="mono">${t.d} ${t.t}</td><td style="text-align:left">${esc(m.left)} vs ${esc(m.right)}</td><td style="text-align:left">${esc(e.selection)}</td>
    <td class="mono">${e.odds_taken??esc(e.odds_range||'未確認')}</td><td class="mono">$${e.stake.toFixed(2)}</td><td class="mono">${r?(r.payout==null?'金額未計算':'$'+r.payout.toFixed(2)):'—'}</td>
    <td class="mono ${r&&r.profit>0?'pos':r&&r.profit<0?'neg':''}">${r?(r.profit==null?'金額未計算':money(r.profit)):'未確定'}</td><td class="mono">${esc((e.locked_at||'').slice(5,16).replace('T',' '))}</td></tr>`;}).join('')+'</tbody>';
}
renderLedger();
})();
</script>
</body>
</html>
